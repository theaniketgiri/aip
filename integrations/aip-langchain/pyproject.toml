[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aip-langchain"
version = "0.1.0"
description = "LangChain integration for the Agent Intent Protocol (AIP) — cryptographic verification for every tool call"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "KYA Labs", email = "team@synthexai.tech" },
]
keywords = ["aip", "langchain", "ai-agents", "security", "verification", "protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "aip-protocol>=0.1.0",
    "langchain-core>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/theaniketgiri/aip"
Documentation = "https://aip.synthexai.tech/docs"
Repository = "https://github.com/theaniketgiri/aip"
