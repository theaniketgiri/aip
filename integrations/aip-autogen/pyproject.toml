[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aip-autogen"
version = "0.1.0"
description = "Microsoft AutoGen integration for the Agent Intent Protocol (AIP) — cryptographic verification for multi-agent conversations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "KYA Labs", email = "team@synthexai.tech" },
]
keywords = ["aip", "autogen", "ai-agents", "security", "verification", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "aip-protocol>=0.1.0",
    "pyautogen>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/theaniketgiri/aip"
Repository = "https://github.com/theaniketgiri/aip"
