[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aip-protocol"
version = "0.2.0"
description = "Agent Intent Protocol — Proof of Intent for the Agentic Web"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Aniket Giri", email = "aniket@kyalabs.com" },
]
keywords = ["ai", "agents", "identity", "verification", "protocol", "trust", "shield", "crewai", "langchain", "autogen"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "cryptography>=42.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
aip = "aip_protocol.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["aip_protocol"]
exclude = ["aip_protocol/mesh.py"]
