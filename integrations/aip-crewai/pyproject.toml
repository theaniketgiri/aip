[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aip-crewai"
version = "0.1.0"
description = "CrewAI integration for the Agent Intent Protocol (AIP) — cryptographic verification for every agent task"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "KYA Labs", email = "team@synthexai.tech" },
]
keywords = ["aip", "crewai", "ai-agents", "security", "verification", "protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "aip-protocol>=0.1.0",
    "crewai>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/theaniketgiri/aip"
Repository = "https://github.com/theaniketgiri/aip"
